<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fill Fusion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="orientation-overlay">
    <p>Please rotate your device to landscape mode</p>
  </div>
  <div id="beat-counter">1</div>
  <main id="app">
    <div id="staff"></div>
  </main>
  <div id="bpm-controls">
    <button id="bpm-dec">−</button>
    <input id="bpm-input" type="number" value="120" min="40" max="300" />
    <button id="bpm-inc">+</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4/build/cjs/vexflow.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
